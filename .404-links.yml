ignore:
  urls:
    - https://www.thepolyglotdeveloper.com/*
    - https://www.npmjs.com/package/@ionic/angular
    - https://www.npmjs.com/package/@robsonos/ionic-mdi
    - https://www.reddit.com/r/ionic/
delay:
  # Space out YouTube requests so scheduled runs avoid transient HTTP 429 rate limits.
  # YouTube URLs are still checked, so a real 404 is still reported.
  'https://www.youtube.com': 1500
